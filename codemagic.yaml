workflows:
  android-debug:
    name: Potato Player — Debug Build
    max_build_duration: 30
    triggering:
      events: []
    environment:
      java: 17
    scripts:
      - name: Set executable permission
        script: chmod +x gradlew
      - name: Build debug APK
        script: ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - riddhishnknight@gmail.com
        notify:
          success: false
          failure: true
